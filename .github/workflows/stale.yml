name: Close stale issues

on:
  schedule:
    - cron: '30 1 * * *'

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          # Only issues explicitly marked as waiting on the reporter are ever staled/closed.
          only-labels: 'awaiting-response'
          days-before-stale: 14
          days-before-close: 7
          stale-issue-message: >-
            This issue has been waiting on a response for 14 days. It will be
            closed in 7 days if there is no further activity.
          close-issue-message: >-
            Closing due to inactivity — happy to reopen if the problem persists.
          remove-stale-when-updated: true
          labels-to-remove-when-unstale: 'awaiting-response'
          days-before-pr-stale: -1
          days-before-pr-close: -1
